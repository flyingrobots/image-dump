<svg viewBox="0 0 215 215" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="107.5" cy="107.5" r="106" fill="#4A148C" />

  <!-- Outer border ring -->
  <circle cx="107.5" cy="107.5" r="105" fill="none" stroke="#4CAF50" stroke-width="5"/>

  <!-- Inner circle for peace symbol -->
  <circle cx="107.5" cy="107.5" r="69" fill="#4A148C"/>

  <!-- Peace symbol -->
  <g fill="#FFEB3B">
    <!-- Vertical line -->
    <rect x="101.5" y="37.5" width="12" height="140"/>
    
    <!-- Left diagonal line -->
    <rect x="101.5" y="107.5" width="12" height="70" transform="rotate(-45 107.5 107.5)"/>
    
    <!-- Right diagonal line -->
    <rect x="101.5" y="107.5" width="12" height="70" transform="rotate(45 107.5 107.5)"/>
  </g>

  <circle cx="107.5" cy="107.5" r="70" fill="none" stroke="#4CAF50" stroke-width="5"/>

  <!-- Text around the circle -->
  <defs>
    <path id="circle-path" 
      d="M 107.5,107.5 
         m -80,0 
         a 80,80 0 1,1 160,0 
         a 80,80 0 1,1 -160,0"/>
  </defs>

  <style>
    .spin {
      animation: spin 20s linear infinite;
      transform-origin: 107.5px 107.5px;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>

  <text font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFEB3B" class="spin">
    <textPath 
      href="#circle-path"
      startOffset="0%"
      textLength="497"
      lengthAdjust="spacing">
      NO KILLER ROBOTS • NO WEAPONS • NO EVIL AI •
    </textPath>
  </text>
</svg>